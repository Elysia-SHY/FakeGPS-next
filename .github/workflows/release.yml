name: Build & Publish Release APK

# 触发方式
#   1) workflow_dispatch —— 推荐。CI 会完成「构建 → 提交 APK → 打 tag → 发 Release」全链路。
#   2) push tag v* —— 兼容手动打 tag 的旧习惯；CI 会把 tag 重新指向包含 APK 的提交后再发 Release。
#
# 为什么 APK 必须提交进仓库树：
#   .gitignore 中已注明，应用内更新的主下载路径是
#   https://cdn.jsdelivr.net/gh/{owner}/{repo}@{tag}/{file}.apk
#   而 jsDelivr 的 /gh/ 端点只服务仓库文件、不服务 Release 资产。
#   因此「提交 APK → 再创建 tag」的顺序是必需的，否则该路径会 404。
#   故本 workflow 始终：先构建、再把 APK 提交到 main、最后才创建/移动 tag。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，例如 v1.4.2；留空则取 app/build.gradle.kts 的 versionName'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  # 同一标签的发布串行执行，避免两次构建互相覆盖提交与 tag
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # 始终在 main 上工作：APK 提交与 tag 都落在这里
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          # 直接用 runner 预装的 Android SDK，不引入 android-actions/setup-android。
          # 该 action 会执行 `sdkmanager tools`，而 `tools` 包早已从 SDK 仓库移除，
          # 会以 "Warning: Failed to find package 'tools'" + exit 1 直接判整条流水线失败。
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          echo "sdkmanager: $SDKMANAGER"
          {
            echo "$(dirname "$SDKMANAGER")"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"
          # 接受许可后再显式安装本项目所需组件（已存在时为空操作）
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$VERSION_NAME"; fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=FakeGPS-next-${TAG}-release.apk" >> "$GITHUB_OUTPUT"
          echo "解析结果：versionName=$VERSION_NAME versionCode=$VERSION_CODE tag=$TAG"

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 优先使用仓库 Secret 中的密钥（填入项目原 debug.keystore 即可与历史版本签名一致）；
          # 未配置时回退到仓库内随源码提交的固定密钥，保证 CI 产物签名长期稳定。
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "使用 Secret 中的签名密钥"
          else
            cp keystore/fakegps-signing.jks "$RUNNER_TEMP/release.jks"
            echo "未配置 Secret，使用仓库内置签名密钥"
          fi
          {
            echo "FAKEGPS_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "FAKEGPS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}"
            echo "FAKEGPS_KEY_ALIAS=${KEY_ALIAS:-fakegps}"
            echo "FAKEGPS_KEY_PASSWORD=${KEY_PASSWORD:-android}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        # 用 `sh` 调用而非 `./gradlew`：仓库长期以 100644 跟踪该脚本（Windows 上提交时
        # 丢失可执行位），不依赖权限位更稳。可执行位已在同一提交中一并修正。
        run: sh ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK and checksum
        id: stage
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          APK="${{ steps.ver.outputs.apk }}"
          cp "$SRC" "$APK"
          # 仓库只保留当前版本的产物，历史版本交给 git history
          for f in $(git ls-files 'FakeGPS-next-*-release.apk'); do
            if [ "$f" != "$APK" ]; then git rm -q "$f"; fi
          done
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  $APK" > SHA256.txt
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK: $APK / $SHA"

      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.ver.outputs.apk }}"

      - name: Commit APK into the tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ steps.ver.outputs.apk }}"
          git add -A -- ':(glob)FakeGPS-next-*-release.apk'
          git add SHA256.txt
          git commit -m "release: ${{ steps.ver.outputs.tag }} (versionCode ${{ steps.ver.outputs.version_code }}) — CI 构建产物" \
            -m "签名指纹: ${{ steps.stage.outputs.sha256 }} (SHA-256 of APK)" || echo "无变更可提交"
          git push origin HEAD:main

      - name: Move tag onto the commit carrying the APK
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          # 强制移动：jsDelivr 的 /gh/{repo}@{tag}/{file}.apk 要求 tag 指向的提交里含该 APK
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          APK="${{ steps.ver.outputs.apk }}"
          NOTES=$(python3 -c "import json;print(json.load(open('version.json',encoding='utf-8'))['releaseNotes'])")
          # 幂等：同名 Release 已存在则先删除（保留 tag）
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$TAG" "$APK" SHA256.txt \
            --title "$TAG" \
            --notes "$NOTES" \
            --latest

      - name: Job summary
        run: |
          {
            echo "## 发布完成"
            echo ""
            echo "- 版本：\`${{ steps.ver.outputs.tag }}\`（versionCode ${{ steps.ver.outputs.version_code }}）"
            echo "- APK：\`${{ steps.ver.outputs.apk }}\`"
            echo "- APK SHA-256：\`${{ steps.stage.outputs.sha256 }}\`"
            echo ""
            echo "下载路径："
            echo "- Release 资产：https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/${{ steps.ver.outputs.apk }}"
            echo "- jsDelivr CDN：https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.ver.outputs.tag }}/${{ steps.ver.outputs.apk }}"
          } >> "$GITHUB_STEP_SUMMARY"
